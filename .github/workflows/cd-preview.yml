name: CD Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cd-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      ALCHEMY_STAGE: preview-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: 48f381bf59212dbd98d2b424ba4b9a04
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_STORE: cloudflare
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      SANDBOX_HMAC_KEY: ${{ secrets.SANDBOX_HMAC_KEY }}
      FREELLM_API_KEY: ${{ secrets.FREELLM_API_KEY }}
      FREELLM_URL: http://127.0.0.1:3001/v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        working-directory: apps/landing
        run: npm ci --workspaces=false

      - name: Install sandbox-runner dependencies
        working-directory: apps/sandbox-runner
        run: npm ci --workspaces=false

      - name: Test root
        run: npm test

      - name: Test landing
        working-directory: apps/landing
        run: npm test --if-present

      - name: Test sandbox-runner
        working-directory: apps/sandbox-runner
        run: npm test

      - id: convex-secret
        name: Detect Convex deploy key
        run: |
          if [ -n "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CONVEX_DEPLOY_KEY not configured; skipping Convex preview deploy."
          fi

      - if: steps.convex-secret.outputs.ready == 'true'
        name: Deploy Convex preview
        run: npx convex preview deploy --preview-name "$PREVIEW_NAME"

      - name: Install Alchemy for deploy
        run: npm install --no-save alchemy

      - name: Deploy Cloudflare preview infrastructure
        run: npm run iac:deploy -- --stage "$ALCHEMY_STAGE"

      - name: Comment preview URLs
        run: |
          cat > /tmp/code-colony-preview.md <<EOF
          Code Colony preview deployed for ${ALCHEMY_STAGE}.

          - App Worker: https://${ALCHEMY_STAGE}-code-colony-app.${CLOUDFLARE_ACCOUNT_ID}.workers.dev
          - Sandbox Worker: https://${ALCHEMY_STAGE}-code-colony-sandbox-runner.${CLOUDFLARE_ACCOUNT_ID}.workers.dev
          - Convex preview: ${PREVIEW_NAME}
          EOF
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/code-colony-preview.md
