name = "code-colony-sandbox-runner"
main = "src/index.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-2"
max_instances = 5

[[durable_objects.bindings]]
class_name = "Sandbox"
name = "Sandbox"

[[migrations]]
new_sqlite_classes = ["Sandbox"]
tag = "v1"
